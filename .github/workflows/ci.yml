name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libcjson-dev cmake build-essential valgrind
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: openHAB for the integration tests
        run: bash .github/openhab/start.sh
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Memory check
        run: valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 build/openhab_integration_test
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cmake --install build --prefix pkg
          tar czf c-openhab-rest-client-${GITHUB_REF_NAME}-linux-x86_64.tar.gz -C pkg .
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: c-openhab-rest-client-*-linux-x86_64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cjson
      - run: cmake -S . -B build && cmake --build build -j && ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with vcpkg
        shell: pwsh
        run: |
          vcpkg install curl cjson --triplet x64-windows
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release
